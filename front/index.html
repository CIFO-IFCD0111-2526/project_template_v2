<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Tareas</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/main.js" defer></script>
    <script src="./js/index.js" defer></script>

</head>

<body>
    <header>
        <nav id="nav">
            <a href="/">Inicio</a>
        </nav>
    <h1>BIENVENIDO</h1>
    </header>
<main class="container-forms">
    <section class="lado-esquerdo">
        <form novalidate class="signin">
            <h2>Login</h2>
            <label for="emailSignIn">*Email</label>
            <input type="email" id="emailSignIn" name="emailSignIn" class="input">

            <label for="passwordSignIn">Password</label>
            <input type="password" id="passwordSignIn" name="passwordSignIn" class="input">

            <button type="submit" class="submit">Sign In!</button>
            <div id="signInRES"></div>
        </form>
    </section>

    <section class="lado-direito">
        <form novalidate class="signup">
            <h2>Sign Up</h2>
            <label for="emailSignUp">*Email</label>
            <input type="email" id="emailSignUp" name="emailSignUp" class="input">

            <label for="passwordSignUp">Password</label>
            <input type="password" id="passwordSignUp" name="passwordSignUp" class="input">

            <label for="passwordSignUpR">Repite contraseña</label>
            <input type="password" id="passwordSignUpR" name="passwordSignUpR" class="input">

            <button type="submit" class="submit">Sign Up!</button>
            <div id="signUpRES"></div>
        </form>
    </section>
</main>
</body>
</html>
