name: Move linked issues to In Review on PR

on:
  pull_request:
    types: [opened, reopened]

jobs:
  move-to-review:
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to In Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwDODyMT8s4BS2Wn";
            const statusFieldId = "PVTSSF_lADODyMT8s4BS2WnzhAQ3Dk";
            const inReviewOptionId = "bc6a8c57";

            const pr = context.payload.pull_request;
            const body = pr.body || "";

            // Find issue references like "closes #1", "fixes #2", "resolves #3", "#4"
            const issueNumbers = [...new Set(
              [...body.matchAll(/(?:closes|fixes|resolves|close|fix|resolve)?\s*#(\d+)/gi)]
                .map(m => parseInt(m[1]))
            )];

            if (issueNumbers.length === 0) {
              console.log("No linked issues found in PR body");
              return;
            }

            for (const issueNumber of issueNumbers) {
              console.log(`Processing issue #${issueNumber}`);

              // Get issue node ID
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const contentId = issue.data.node_id;

              // Find the item in the project
              const result = await github.graphql(`
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId });

              const item = result.node.items.nodes.find(
                n => n.content && n.content.number === issueNumber
              );

              if (!item) {
                console.log(`Issue #${issueNumber} not found in project, skipping`);
                continue;
              }

              // Update status to In Review
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId,
                itemId: item.id,
                fieldId: statusFieldId,
                optionId: inReviewOptionId,
              });

              console.log(`Issue #${issueNumber} moved to In Review`);
            }
