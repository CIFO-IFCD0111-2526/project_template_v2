name: Move linked issues to Done on PR merge

on:
  pull_request:
    types: [closed]

jobs:
  move-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwDODyMT8s4BS2Wn";
            const statusFieldId = "PVTSSF_lADODyMT8s4BS2WnzhAQ3Dk";
            const doneOptionId = "98236657";

            const pr = context.payload.pull_request;
            const body = pr.body || "";

            const issueNumbers = [...new Set(
              [...body.matchAll(/(?:closes|fixes|resolves|close|fix|resolve)?\s*#(\d+)/gi)]
                .map(m => parseInt(m[1]))
            )];

            if (issueNumbers.length === 0) {
              console.log("No linked issues found in PR body");
              return;
            }

            for (const issueNumber of issueNumbers) {
              console.log(`Processing issue #${issueNumber}`);

              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const result = await github.graphql(`
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId });

              const item = result.node.items.nodes.find(
                n => n.content && n.content.number === issueNumber
              );

              if (!item) {
                console.log(`Issue #${issueNumber} not found in project, skipping`);
                continue;
              }

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId,
                itemId: item.id,
                fieldId: statusFieldId,
                optionId: doneOptionId,
              });

              console.log(`Issue #${issueNumber} moved to Done`);
            }
